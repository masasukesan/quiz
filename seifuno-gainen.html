<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正負の数の概念 2択クイズ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
    background: #f5f7f5;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
  }
  #quiz-app { width: 100%; max-width: 620px; }
  h1 {
    font-size: 20px;
    font-weight: 500;
    color: #085041;
    margin-bottom: 1.5rem;
    padding-bottom: 0.75rem;
    border-bottom: 2px solid #1D9E75;
  }
  .progress-bar { height: 4px; background: #d0e8e0; border-radius: 2px; margin-bottom: 1.5rem; }
  .progress-fill { height: 100%; background: #1D9E75; border-radius: 2px; transition: width 0.4s ease; }
  .q-counter { font-size: 13px; color: #5F5E5A; margin-bottom: 0.75rem; }
  .question-card {
    background: #fff;
    border: 1px solid #d0e8e0;
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1rem;
  }
  .question-text { font-size: 17px; font-weight: 500; line-height: 1.7; }
  .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 1.25rem; }
  .choice-btn {
    background: #f5f7f5;
    border: 1px solid #c0d8ce;
    border-radius: 8px;
    padding: 0.85rem 1rem;
    font-size: 15px;
    font-family: inherit;
    color: #1a1a1a;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s, border-color 0.15s;
  }
  .choice-btn:hover:not(:disabled) { background: #fff; border-color: #1D9E75; }
  .choice-btn.correct { background: #E1F5EE; border-color: #1D9E75; color: #085041; font-weight: 500; }
  .choice-btn.wrong { background: #FCEBEB; border-color: #E24B4A; color: #501313; }
  .choice-btn:disabled { cursor: default; }
  .feedback {
    margin-top: 1rem;
    padding: 0.85rem 1rem;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.7;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct-fb { background: #E1F5EE; color: #085041; border: 1px solid #5DCAA5; }
  .feedback.wrong-fb { background: #FCEBEB; color: #501313; border: 1px solid #F09595; }
  .next-btn {
    margin-top: 1rem;
    padding: 0.75rem 1.5rem;
    background: #fff;
    border: 1px solid #c0d8ce;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    color: #1a1a1a;
    cursor: pointer;
    display: none;
  }
  .next-btn.show { display: inline-block; }
  .next-btn:hover { background: #f5f7f5; border-color: #1D9E75; }
  .result-card {
    background: #fff;
    border: 1px solid #d0e8e0;
    border-radius: 12px;
    padding: 2.5rem;
    text-align: center;
    display: none;
  }
  .result-card.show { display: block; }
  .result-title { font-size: 16px; color: #5F5E5A; margin-bottom: 0.5rem; }
  .result-score { font-size: 56px; font-weight: 500; color: #1D9E75; }
  .result-pct { font-size: 14px; color: #5F5E5A; margin-top: 0.25rem; }
  .result-msg { font-size: 16px; color: #1a1a1a; margin: 1.25rem 0; }
  .retry-btn {
    padding: 0.75rem 2rem;
    background: #1D9E75;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    color: #fff;
    cursor: pointer;
  }
  .retry-btn:hover { background: #0F6E56; }
  @media (max-width: 480px) {
    .question-text { font-size: 15px; }
    .result-score { font-size: 44px; }
  }
</style>
</head>
<body>
<div id="quiz-app">
  <h1>正負の数の概念 2択クイズ</h1>
  <div id="quiz-main">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="q-counter" id="q-counter"></div>
    <div class="question-card">
      <div class="question-text" id="q-text"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <button class="next-btn" id="next-btn">次の問題 →</button>
  </div>
  <div class="result-card" id="result-card">
    <div class="result-title">スコア</div>
    <div class="result-score" id="result-score"></div>
    <div class="result-pct" id="result-pct"></div>
    <div class="result-msg" id="result-msg"></div>
    <button class="retry-btn" id="retry-btn">もう一度チャレンジ</button>
  </div>
</div>
<script>
const questions = [
  {q:"「－（マイナス）」が表す本当の意味は？",choices:["（基準から見て）反対の性質、逆の方向","常に「0より小さい」という状態"],correct:0,fb_correct:"「反対」「逆」という意味が核心です。数直線での方向をイメージしましょう。",fb_wrong:"それは0を基準にした結果であり、意味は「逆」です！"},
  {q:"「－（－3）」が「＋3」になる理由は？",choices:["「3減る」の「逆（マイナス）」だから「3増える（プラス）」","マイナスとマイナスがぶつかるとプラスに変わるというルールだから"],correct:0,fb_correct:"「逆の逆」＝元に戻る、という考え方が大切です。",fb_wrong:"それは「暗記」です。意味は「逆の逆」です。"},
  {q:"数直線で「－5」と「－2」はどちらが大きい？",choices:["「－2」","「－5」"],correct:0,fb_correct:"数直線で右側にあるほうが大きい。－2は－5より右にあります。",fb_wrong:"マイナスがつくと、数字が大きいほど小さくなります。"},
  {q:"（－5）＋（－3）の計算で「まず最初に考えること」は？",choices:["答えの符号（＋かーか）を決める","5＋3をして、あとでマイナスをつける"],correct:0,fb_correct:"「5減って3減る」だから、答えもーになりますね。",fb_wrong:"まず最初に、答えは＋になるのかーになるのかを考えましょう。"},
  {q:"（－5）－（－3）の計算の「次の一手」は？",choices:["－5＋3と、足し算（逆の逆はプラス）に直す","5－3をして、大きい方の符号をつける"],correct:0,fb_correct:"引き算を足し算に変換することで、計算がシンプルになります。",fb_wrong:"まず「引き算（逆を引く）」を「足し算（順を足す）」に変換して整理します。"},
  {q:"（－2）×（－3）の符号が「＋」になる理由は？",choices:["「2減る」の「逆を3回」かけるから","掛け算のときはマイナスが2つあればプラスになるルールだから"],correct:0,fb_correct:"「逆の逆」＝プラス、という意味の積み重ねです。",fb_wrong:"ルールの裏にある「本当の意味」を理解しましょう。"},
  {q:"「絶対値」とは何をあらわしている？",choices:["0（原点）からの「距離」","数字からマイナスを取ったもの"],correct:0,fb_correct:"絶対値＝0からどれだけ離れているか、という距離の概念です。",fb_wrong:"それは「作業」です。意味は「どれだけ離れているか」です。"},
  {q:"「絶対値が3」と言われたら、数はいくつある？",choices:["＋3 と －3 の「2つ」","3 の「1つ」"],correct:0,fb_correct:"0から3離れている場所は、右（＋3）と左（－3）の両方にあります。",fb_wrong:"0から3離れている場所は、右と左の両方にあります。"},
  {q:"（－2）³と －2³ の違いは？",choices:["（－2）×（－2）×（－2）と、－（2×2×2）","計算の結果がプラスになるかマイナスになるかの違い"],correct:0,fb_correct:"かっこの有無で「何を3乗するか」が変わります。",fb_wrong:"それは「結果」です。中身は「何を何回掛けているか」の違いです。"},
  {q:"負の数で割る（除法）の考え方は？",choices:["「逆の方向へ向ける」という操作が含まれている","掛け算を逆さにするだけの作業"],correct:0,fb_correct:"割り算は逆数にすれば掛け算。符号（方向）の確定が最優先です。",fb_wrong:"割り算も掛け算と同様、符号の決定（方向の確定）が最優先です。"}
];

let order=[], current=0, score=0, answered=false;

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function startQuiz(){
  order=shuffle(questions.map((_,i)=>i));
  current=0; score=0;
  document.getElementById('result-card').classList.remove('show');
  document.getElementById('quiz-main').style.display='';
  showQuestion();
}

function showQuestion(){
  answered=false;
  const q=questions[order[current]];
  const total=questions.length;
  document.getElementById('progress').style.width=((current/total)*100)+'%';
  document.getElementById('q-counter').textContent=`問題 ${current+1} / ${total}`;
  document.getElementById('q-text').textContent=q.q;
  const choicesEl=document.getElementById('choices');
  choicesEl.innerHTML='';
  const shuffled=shuffle(q.choices.map((c,i)=>({text:c,idx:i})));
  shuffled.forEach(({text,idx})=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';
    btn.textContent=text;
    btn.onclick=()=>selectAnswer(idx,q,btn,choicesEl);
    choicesEl.appendChild(btn);
  });
  document.getElementById('feedback').className='feedback';
  document.getElementById('feedback').textContent='';
  document.getElementById('next-btn').className='next-btn';
}

function selectAnswer(idx,q,btn,choicesEl){
  if(answered)return;
  answered=true;
  const isCorrect=idx===q.correct;
  if(isCorrect)score++;
  Array.from(choicesEl.children).forEach(b=>{
    b.disabled=true;
    const i=q.choices.indexOf(b.textContent);
    if(i===q.correct)b.classList.add('correct');
    else if(b===btn&&!isCorrect)b.classList.add('wrong');
  });
  const fb=document.getElementById('feedback');
  fb.textContent=isCorrect?q.fb_correct:q.fb_wrong;
  fb.className='feedback show '+(isCorrect?'correct-fb':'wrong-fb');
  document.getElementById('next-btn').className='next-btn show';
}

document.getElementById('next-btn').onclick=()=>{
  current++;
  if(current>=questions.length)showResult();
  else showQuestion();
};

function showResult(){
  document.getElementById('quiz-main').style.display='none';
  const pct=Math.round((score/questions.length)*100);
  document.getElementById('result-score').textContent=`${score} / ${questions.length}`;
  document.getElementById('result-pct').textContent=`正解率 ${pct}%`;
  const msg=pct===100?'全問正解！完璧です！':pct>=70?'よくできました！もう少しで完璧です。':'もう一度チャレンジしてみましょう！';
  document.getElementById('result-msg').textContent=msg;
  document.getElementById('result-card').classList.add('show');
}

document.getElementById('retry-btn').onclick=startQuiz;
startQuiz();
</script>
</body>
</html>
